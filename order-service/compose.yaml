# Isolates container, network, and volume names from the other microservice Compose projects.
name: orderflow-order

services:
  # Persistent local-development database used only by Order Service.
  order-postgres:
    # Alpine keeps the development image small while retaining standard PostgreSQL behavior.
    image: postgres:17-alpine
    # These defaults match application.yml and are intended for local development only.
    environment:
      POSTGRES_DB: orderflow_orders
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    # Inventory owns host port 5432, so Order maps its PostgreSQL port to host port 5433.
    ports:
      - "5433:5432"
    # Readiness is based on accepting connections to the expected database as the expected user.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow_orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The named volume preserves orders when the container itself is recreated.
    volumes:
      - order-postgres-data:/var/lib/postgresql/data

volumes:
  # Docker manages the platform-specific storage location behind this stable logical name.
  order-postgres-data:
