spring:
  # Nombre lógico de la aplicación utilizado en los registros y en la infraestructura de Spring.
  application:
    name: order-service
  # La conexión local explícita mantiene este servicio independiente del descubrimiento automático de Docker Compose.
  # Las variables de entorno permiten que las plataformas de despliegue proporcionen credenciales administradas de PostgreSQL.
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5433/orderflow_orders}
    username: ${ORDER_DB_USERNAME:orderflow}
    password: ${ORDER_DB_PASSWORD:orderflow}
  jpa:
    hibernate:
      # Flyway gestiona los cambios del esquema; Hibernate solo verifica la compatibilidad entre entidades y esquema.
      ddl-auto: validate
    # Evita que el acceso diferido a la base de datos se extienda más allá del límite transaccional de la aplicación.
    open-in-view: false
  flyway:
    # Aplica las migraciones versionadas del classpath antes de que Hibernate valide sus mapeos.
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all

orderflow:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      inventory-commands: ${ORDER_INVENTORY_COMMANDS_TOPIC:order.inventory.commands}
      inventory-events: ${INVENTORY_ORDER_EVENTS_TOPIC:inventory.order.events}
      payment-commands: ${ORDER_PAYMENT_COMMANDS_TOPIC:order.payment.commands}
      payment-events: ${PAYMENT_ORDER_EVENTS_TOPIC:payment.order.events}
      order-events: ${ORDER_EVENTS_TOPIC:order.events}
    groups:
      inventory-events: ${ORDER_INVENTORY_EVENTS_GROUP:order-service.inventory-events}
      payment-events: ${ORDER_PAYMENT_EVENTS_GROUP:order-service.payment-events}

server:
  # Order utiliza de forma predeterminada un puerto HTTP dedicado que sigue siendo configurable durante el despliegue.
  port: ${ORDER_SERVICE_PORT:8081}
