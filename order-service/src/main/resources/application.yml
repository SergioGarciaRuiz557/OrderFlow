spring:
  # Logical application name used in logs and Spring infrastructure.
  application:
    name: order-service
  # Explicit local connection keeps this service independent from Docker Compose auto-discovery.
  # Environment variables allow deployment platforms to supply managed PostgreSQL credentials.
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5433/orderflow_orders}
    username: ${ORDER_DB_USERNAME:orderflow}
    password: ${ORDER_DB_PASSWORD:orderflow}
  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate only verifies entity/schema compatibility.
      ddl-auto: validate
    # Prevents lazy database access from leaking beyond the transactional application boundary.
    open-in-view: false
  flyway:
    # Applies versioned classpath migrations before Hibernate validates its mappings.
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all

orderflow:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      inventory-commands: ${ORDER_INVENTORY_COMMANDS_TOPIC:order.inventory.commands}
      inventory-events: ${INVENTORY_ORDER_EVENTS_TOPIC:inventory.order.events}
      payment-commands: ${ORDER_PAYMENT_COMMANDS_TOPIC:order.payment.commands}
      payment-events: ${PAYMENT_ORDER_EVENTS_TOPIC:payment.order.events}
      order-events: ${ORDER_EVENTS_TOPIC:order.events}
    groups:
      inventory-events: ${ORDER_INVENTORY_EVENTS_GROUP:order-service.inventory-events}
      payment-events: ${ORDER_PAYMENT_EVENTS_GROUP:order-service.payment-events}

server:
  # Order uses a dedicated HTTP port by default and remains configurable in deployment.
  port: ${ORDER_SERVICE_PORT:8081}
