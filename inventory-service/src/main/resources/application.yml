spring:
  application:
    # Nombre lógico del servicio expuesto mediante el entorno de aplicación de Spring.
    name: inventory-service
  datasource:
    # Los valores locales predeterminados facilitan el desarrollo; las variables de entorno aportan secretos específicos del despliegue.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    # Evita que las solicitudes web accedan a la base de datos después de finalizar la transacción del adaptador.
    open-in-view: false
    hibernate:
      # Flyway gestiona el DDL; Hibernate solo comprueba que los mapeos de entidades coincidan con el esquema migrado.
      ddl-auto: validate
  flyway:
    # Aplica las migraciones versionadas antes de que JPA inicialice y valide sus mapeos.
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all

orderflow:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    group: ${INVENTORY_COMMANDS_GROUP:inventory-service.commands}
    topics:
      inventory-commands: ${ORDER_INVENTORY_COMMANDS_TOPIC:order.inventory.commands}
      inventory-events: ${INVENTORY_ORDER_EVENTS_TOPIC:inventory.order.events}
