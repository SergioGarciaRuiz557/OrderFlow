name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - inventory-service
          - notification-service
          - order-service
          - payment-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x gradlew

      - name: Compile and test
        working-directory: ${{ matrix.service }}
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.service }}/build/reports/tests/
            ${{ matrix.service }}/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    name: CI quality gate
    if: always()
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify all services passed
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "At least one service failed to compile or pass its tests."
            exit 1
          fi
          echo "All services compiled and passed their tests."
