# Todo: docker compose up -d --build
# Infraestructura: docker compose up -d --wait postgres kafka
# Selección: docker compose up -d --build order-service inventory-service
name: orderflow

services:
  order-service:
    build: order-service
    mem_limit: 350m
    ports:
      - "${ORDER_SERVICE_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ORDER_INVENTORY_COMMANDS_TOPIC=${ORDER_INVENTORY_COMMANDS_TOPIC:-order.inventory.commands}
      - INVENTORY_ORDER_EVENTS_TOPIC=${INVENTORY_ORDER_EVENTS_TOPIC:-inventory.order.events}
      - ORDER_PAYMENT_COMMANDS_TOPIC=${ORDER_PAYMENT_COMMANDS_TOPIC:-order.payment.commands}
      - PAYMENT_ORDER_EVENTS_TOPIC=${PAYMENT_ORDER_EVENTS_TOPIC:-payment.order.events}
      - ORDER_EVENTS_TOPIC=${ORDER_EVENTS_TOPIC:-order.events}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    build: inventory-service
    mem_limit: 350m
    ports:
      - "${INVENTORY_SERVICE_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ORDER_INVENTORY_COMMANDS_TOPIC=${ORDER_INVENTORY_COMMANDS_TOPIC:-order.inventory.commands}
      - INVENTORY_ORDER_EVENTS_TOPIC=${INVENTORY_ORDER_EVENTS_TOPIC:-inventory.order.events}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build: payment-service
    mem_limit: 350m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ORDER_PAYMENT_COMMANDS_TOPIC=${ORDER_PAYMENT_COMMANDS_TOPIC:-order.payment.commands}
      - PAYMENT_ORDER_EVENTS_TOPIC=${PAYMENT_ORDER_EVENTS_TOPIC:-payment.order.events}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: notification-service
    mem_limit: 350m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ORDER_EVENTS_TOPIC=${ORDER_EVENTS_TOPIC:-order.events}
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      # TCP solo está disponible cuando termina la inicialización de todas las bases de datos.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    # La imagen JVM incluye las herramientas CLI utilizadas por el healthcheck.
    image: apache/kafka:3.8.0
    mem_limit: 1024m
    ports:
      # Kafka IO y los microservicios iniciados desde el host/IDE utilizan localhost:9092.
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # Configuración KRaft de un solo nodo: Kafka gestiona sus propios metadatos sin ZooKeeper.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      # Escucha en todas las interfaces del contenedor; cada cliente recibe su dirección accesible.
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Los topics internos de Kafka deben admitir un clúster de desarrollo con un único broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Puente HTTP opcional para ejecutar desde orderflow.http los contratos Kafka de forma manual.
  # Se mantiene fuera del arranque normal y solo se habilita con --profile manual-testing.
  kafka-rest:
    image: confluentinc/cp-kafka-rest:7.8.11
    profiles: ["manual-testing"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: localhost
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      KAFKA_REST_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/topics >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  kafka-data:
