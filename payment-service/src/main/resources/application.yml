spring:
  application:
    # Logical service name used by Spring diagnostics and future observability integrations.
    name: payment-service
  datasource:
    # Local PostgreSQL defaults; deployment environments override values without changing the artifact.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    # Prevents accidental lazy database access outside adapter-managed transactions.
    open-in-view: false
    hibernate:
      # Flyway owns all schema changes; Hibernate only verifies mappings against the migrated schema.
      ddl-auto: validate
  flyway:
    # Applies versioned payment migrations before Hibernate validates its entity mapping.
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all

orderflow:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    group: ${PAYMENT_COMMANDS_GROUP:payment-service.commands}
    topics:
      payment-commands: ${ORDER_PAYMENT_COMMANDS_TOPIC:order.payment.commands}
      payment-events: ${PAYMENT_ORDER_EVENTS_TOPIC:payment.order.events}
