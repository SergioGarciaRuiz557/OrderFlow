spring:
  application:
    # Nombre lógico del servicio que usan los diagnósticos de Spring y las futuras integraciones de observabilidad.
    name: payment-service
  datasource:
    # Valores locales predeterminados de PostgreSQL; los entornos de despliegue los sustituyen sin cambiar el artefacto.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    # Evita el acceso diferido accidental a la base de datos fuera de las transacciones administradas por el adaptador.
    open-in-view: false
    hibernate:
      # Flyway es responsable de todos los cambios del esquema; Hibernate solo verifica las asignaciones frente al esquema migrado.
      ddl-auto: validate
  flyway:
    # Aplica las migraciones versionadas de pagos antes de que Hibernate valide la asignación de sus entidades.
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all

orderflow:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    group: ${PAYMENT_COMMANDS_GROUP:payment-service.commands}
    topics:
      payment-commands: ${ORDER_PAYMENT_COMMANDS_TOPIC:order.payment.commands}
      payment-events: ${PAYMENT_ORDER_EVENTS_TOPIC:payment.order.events}
